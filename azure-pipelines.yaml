trigger:
  branches:
    include:
      - master

resources:
  repositories:
    - repository: ops-pipelines
      type: git
      name: OPS/ops-pipelines

variables:
  REPOSITORY: nginx-s3-gateway
  SERVICE_NAMESPACE: default
  SERVICE_NAME: nginx-s3-gateway

stages:
  # ── Stage 1: compute IMAGE_TAG ────────────────────────────────────────────
  - stage: prepare
    displayName: "Prepare"
    jobs:
      - job: get_tag
        displayName: "Get image tag"
        pool: Default
        steps:
          - script: |
              GITHEAD=$(git rev-parse --short HEAD)
              echo "build version ${GITHEAD}"
              echo "##vso[task.setvariable variable=IMAGE_TAG;isOutput=true]$GITHEAD"
            name: set_tag
            displayName: "Get image tag from git commit id"

  # ── Stage 2: build & push to ECR ─────────────────────────────────────────
  - stage: build
    displayName: "Build"
    dependsOn: prepare
    variables:
      IMAGE_TAG: $[ stageDependencies.prepare.get_tag.outputs['set_tag.IMAGE_TAG'] ]
    jobs:
      - template: templates/docker-build-v3.yaml@ops-pipelines
        parameters:
          repository: $(REPOSITORY)
          tags: $(IMAGE_TAG)
          build_context: "."
          dockerfile: "Dockerfile"
          arguments: ""
          multi_platform: true
