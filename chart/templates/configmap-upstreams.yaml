apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nginx-multi-s3-gateway.fullname" . }}-per-bucket-upstreams
  labels:
    {{- include "nginx-multi-s3-gateway.labels" . | nindent 4 }}
data:
  per-bucket-upstreams.conf: |
    # Generated by Helm — per-bucket upstreams for S3_STYLE=virtual-v2.
    # For virtual / path style this file is intentionally empty; all buckets
    # share the default storage_urls upstream defined in upstreams.conf.
    #
    # SECURITY: bucket names are sourced from values.yaml (operator-controlled),
    # not from request headers, so there is no injection risk.
{{- if and (eq .Values.s3.style "virtual-v2") .Values.buckets }}
{{- range .Values.buckets }}
    upstream storage_{{ .name | replace "-" "_" }} {
        zone s3_{{ .name | replace "-" "_" }} 64k;
        server {{ .name }}.{{ $.Values.s3.server }}:{{ $.Values.s3.serverPort }} resolve;
        keepalive 32;
    }
{{- end }}
{{- end }}
