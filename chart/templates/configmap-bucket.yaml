apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nginx-multi-s3-gateway.fullname" . }}-bucket-map
  labels:
    {{- include "nginx-multi-s3-gateway.labels" . | nindent 4 }}
data:
  bucket-map.conf: |
    # Generated by Helm – do not edit manually.
    # Re-rendered on every 'helm upgrade'; rolling restart triggered via
    # checksum/config annotation on the Deployment.
    #
    # SECURITY: values not in the whitelist map to "" which silently falls
    # back to S3_BUCKET_NAME. Clients cannot access arbitrary buckets.

    # 1. Whitelist: X-S3-Bucket header value → canonical bucket name.
    #    Unlisted values → "" → fallback to default S3_BUCKET_NAME.
    map $http_x_s3_bucket $s3_bucket_name_var {
        default    "";
    {{- range .Values.buckets }}
        "{{ .name }}"    "{{ .name }}";
    {{- end }}
    }

    # 2. Bucket name → S3 host header (used for TLS SNI and AWS Sig signing).
    map $s3_bucket_name_var $s3_host {
        default    "{{ include "nginx-multi-s3-gateway.s3HostHeader" . }}";
    {{- range .Values.buckets }}
        "{{ .name }}"    "{{ include "nginx-multi-s3-gateway.bucketS3Host" (dict "bucket" . "root" $) }}";
    {{- end }}
    }

    # 3. Bucket name → upstream group.
    #    virtual/path: all buckets share storage_urls (same S3 endpoint).
    #    virtual-v2:   each bucket needs its own upstream defined in upstreams.conf.template.
    map $s3_bucket_name_var $s3_upstream {
        default    "storage_urls";
    {{- range .Values.buckets }}
    {{- if eq $.Values.s3.style "virtual-v2" }}
        "{{ .name }}"    "storage_{{ .name | replace "-" "_" }}";
    {{- else }}
        "{{ .name }}"    "storage_urls";
    {{- end }}
    {{- end }}
    }
