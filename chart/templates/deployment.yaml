apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nginx-multi-s3-gateway.fullname" . }}
  labels:
    {{- include "nginx-multi-s3-gateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nginx-multi-s3-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Triggers rolling restart when bucket whitelist or per-bucket upstream ConfigMap changes.
        checksum/config: {{ list (include (print $.Template.BasePath "/configmap-bucket.yaml") .) (include (print $.Template.BasePath "/configmap-upstreams.yaml") .) | join "" | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "nginx-multi-s3-gateway.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nginx-multi-s3-gateway.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          env:
            # --- Core S3 settings ---
            - name: S3_BUCKET_NAME
              value: {{ required "s3.bucketName is required" .Values.s3.bucketName | quote }}
            - name: S3_SERVER
              value: {{ .Values.s3.server | quote }}
            - name: S3_SERVER_PORT
              value: {{ .Values.s3.serverPort | quote }}
            - name: S3_SERVER_PROTO
              value: {{ .Values.s3.serverProto | quote }}
            - name: S3_REGION
              value: {{ .Values.s3.region | quote }}
            - name: S3_STYLE
              value: {{ .Values.s3.style | quote }}
            - name: S3_SERVICE
              value: {{ .Values.s3.service | quote }}
            # --- AWS signature ---
            - name: AWS_SIGS_VERSION
              value: {{ .Values.aws.sigVersion | quote }}
            # --- NGINX cache tuning ---
            - name: PROXY_CACHE_VALID_OK
              value: {{ .Values.nginx.proxyCacheValidOk | quote }}
            - name: PROXY_CACHE_VALID_NOTFOUND
              value: {{ .Values.nginx.proxyCacheValidNotfound | quote }}
            - name: PROXY_CACHE_VALID_FORBIDDEN
              value: {{ .Values.nginx.proxyCacheValidForbidden | quote }}
            - name: PROXY_CACHE_USE_STALE
              value: {{ .Values.nginx.proxyCacheUseStale | quote }}
            - name: PROXY_CACHE_SLICE_SIZE
              value: {{ .Values.nginx.proxyCacheSliceSize | quote }}
            - name: PROXY_CACHE_MAX_SIZE
              value: {{ .Values.nginx.proxyCacheMaxSize | quote }}
            - name: PROXY_CACHE_INACTIVE
              value: {{ .Values.nginx.proxyCacheInactive | quote }}
            - name: PROXY_CACHE_BYPASS_PATHS
              value: {{ if .Values.nginx.proxyCacheBypassPaths }}{{ join "|" .Values.nginx.proxyCacheBypassPaths | quote }}{{ else }}"^$"{{ end }}
            # --- CORS / methods ---
            # Upstream entrypoint derives LIMIT_METHODS_TO and LIMIT_METHODS_TO_CSV from this.
            - name: CORS_ENABLED
              value: {{ ternary "1" "0" .Values.nginx.corsEnabled | quote }}
            # --- Optional features ---
            - name: ALLOW_DIRECTORY_LIST
              value: {{ ternary "1" "0" .Values.nginx.allowDirectoryList | quote }}
            {{- if .Values.nginx.stripLeadingDirectoryPath }}
            - name: STRIP_LEADING_DIRECTORY_PATH
              value: {{ .Values.nginx.stripLeadingDirectoryPath | quote }}
            {{- end }}
            {{- if .Values.nginx.prefixLeadingDirectoryPath }}
            - name: PREFIX_LEADING_DIRECTORY_PATH
              value: {{ .Values.nginx.prefixLeadingDirectoryPath | quote }}
            {{- end }}
            {{- if .Values.nginx.directoryListingPathPrefix }}
            - name: DIRECTORY_LISTING_PATH_PREFIX
              value: {{ .Values.nginx.directoryListingPathPrefix | quote }}
            {{- end }}
            {{- if .Values.nginx.dnsResolvers }}
            - name: DNS_RESOLVERS
              value: {{ .Values.nginx.dnsResolvers | quote }}
            {{- end }}
            {{- if .Values.aws.debug }}
            - name: DEBUG
              value: "1"
            {{- end }}
            {{- if .Values.nginx.provideIndexPage }}
            - name: PROVIDE_INDEX_PAGE
              value: "1"
            {{- end }}
            {{- if .Values.nginx.appendSlashForPossibleDirectory }}
            - name: APPEND_SLASH_FOR_POSSIBLE_DIRECTORY
              value: "1"
            {{- end }}
            {{- if .Values.nginx.jsTrustedCertPath }}
            - name: JS_TRUSTED_CERT_PATH
              value: {{ .Values.nginx.jsTrustedCertPath | quote }}
            {{- end }}
            {{- if .Values.nginx.headerPrefixesToStrip }}
            - name: HEADER_PREFIXES_TO_STRIP
              value: {{ .Values.nginx.headerPrefixesToStrip | quote }}
            {{- end }}
            {{- if .Values.nginx.headerPrefixesAllowed }}
            - name: HEADER_PREFIXES_ALLOWED
              value: {{ .Values.nginx.headerPrefixesAllowed | quote }}
            {{- end }}
            {{- if .Values.nginx.corsAllowedOrigin }}
            - name: CORS_ALLOWED_ORIGIN
              value: {{ .Values.nginx.corsAllowedOrigin | quote }}
            {{- end }}
            {{- if .Values.nginx.corsAllowPrivateNetworkAccess }}
            - name: CORS_ALLOW_PRIVATE_NETWORK_ACCESS
              value: {{ .Values.nginx.corsAllowPrivateNetworkAccess | quote }}
            {{- end }}
            {{- if .Values.aws.roleSessionName }}
            - name: AWS_ROLE_SESSION_NAME
              value: {{ .Values.aws.roleSessionName | quote }}
            {{- end }}
            {{- if .Values.aws.stsEndpoint }}
            - name: STS_ENDPOINT
              value: {{ .Values.aws.stsEndpoint | quote }}
            {{- end }}
            {{- if .Values.aws.stsRegionalEndpoints }}
            - name: AWS_STS_REGIONAL_ENDPOINTS
              value: {{ .Values.aws.stsRegionalEndpoints | quote }}
            {{- end }}
            # --- Non-IRSA AWS credentials (omit when using IRSA) ---
            {{- if .Values.s3.existingSecret }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecret }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecret }}
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecret }}
                  key: AWS_SESSION_TOKEN
                  optional: true
            {{- end }}
          volumeMounts:
            # bucket-map.conf is mounted via subPath so it does not affect
            # other files already present in /etc/nginx/conf.d/gateway/.
            - name: bucket-map
              mountPath: /etc/nginx/conf.d/gateway/bucket-map.conf
              subPath: bucket-map.conf
              readOnly: true
            # per-bucket-upstreams.conf is rendered by Helm and contains upstream
            # blocks for each whitelisted bucket when S3_STYLE=virtual-v2.
            # Empty (comments only) for virtual/path style — always mounted so
            # the include directive in upstreams.conf.template never fails.
            - name: per-bucket-upstreams
              mountPath: /etc/nginx/conf.d/gateway/per-bucket-upstreams.conf
              subPath: per-bucket-upstreams.conf
              readOnly: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.metrics.enabled }}
        - name: metrics
          image: "{{ .Values.metrics.image.repository }}:{{ .Values.metrics.image.tag }}"
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy }}
          args:
            - "-nginx.scrape-uri=http://127.0.0.1:80/stub_status"
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.metrics.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        - name: bucket-map
          configMap:
            name: {{ include "nginx-multi-s3-gateway.fullname" . }}-bucket-map
        - name: per-bucket-upstreams
          configMap:
            name: {{ include "nginx-multi-s3-gateway.fullname" . }}-per-bucket-upstreams
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
